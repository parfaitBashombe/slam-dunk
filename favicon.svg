<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <clipPath id="ball">
      <circle cx="16" cy="16" r="14.5"/>
    </clipPath>
  </defs>

  <!-- Ball fill -->
  <circle cx="16" cy="16" r="14.5" fill="#c91c14"/>

  <!-- Seam lines clipped to ball shape -->
  <g clip-path="url(#ball)" stroke="#0e0c0a" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- Vertical seam -->
    <line x1="16" y1="1" x2="16" y2="31"/>
    <!-- Horizontal seam -->
    <line x1="1" y1="16" x2="31" y2="16"/>
    <!-- Upper arc seam -->
    <path d="M4 7 Q16 20 28 7"/>
    <!-- Lower arc seam -->
    <path d="M4 25 Q16 12 28 25"/>
  </g>

  <!-- Ball outline -->
  <circle cx="16" cy="16" r="14.5" stroke="#0e0c0a" stroke-width="1"/>
</svg>
